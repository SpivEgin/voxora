name: voip-server
services:
  # CockroachDB — primary durable datastore
  cockroachdb:
    image: cockroachdb/cockroach:latest-v24.1
    container_name: voip-cockroachdb
    command: start-single-node --insecure --store=type=pebble,path=/cockroach/crdb-data --listen-addr=0.0.0.0:26257 --sql-addr=0.0.0.0:26258 --http-addr=0.0.0.0:8081
    ports:
      - "26257:26257"   # SQL port
      - "26258:26258"   # PostgreSQL wire protocol
      - "8081:8081"     # Admin UI
    volumes:
      - cockroach-data:/cockroach/crdb-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis for session state (hot cache / pub-sub)
  redis:
    image: redis:7-alpine
    container_name: voip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Ollama for LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: voip-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Whisper STT service
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: voip-whisper
    ports:
      - "9090:8000"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_LANGUAGE=en
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - whisper-cache:/root/.cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Piper TTS service
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: voip-piper
    ports:
      - "5000:10200"
    volumes:
      - piper-data:/data
    command: --voice en_US-lessac-medium
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10200/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vosk STT (alternative)
  vosk:
    image: alphacep/kaldi-en:latest
    container_name: voip-vosk
    ports:
      - "2700:2700"
    volumes:
      - vosk-model:/opt/vosk-model
    restart: unless-stopped
    profiles:
      - vosk

  # VoIP Server
  voip-server:
    build:
      context: ./voip-server
      dockerfile: Dockerfile
    container_name: voip-server
    ports:
      - "8080:8080"
      - "5060:5060/udp"
      - "5061:5061/udp"
    depends_on:
      cockroachdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      whisper:
        condition: service_healthy
      piper:
        condition: service_healthy
    volumes:
      - ./voip-server/configs:/app/configs:ro
      - voip-logs:/var/log/voip-server
    environment:
      - VOIP_ENVIRONMENT=production
      - VOIP_COCKROACHDB_HOST=cockroachdb
      - VOIP_REDIS_HOST=redis
      - VOIP_LLM_OLLAMA_HOST=ollama
      - VOIP_STT_WHISPER_HOST=whisper
      - VOIP_TTS_PIPER_HOST=piper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Pull models (one-time setup)
  ollama-pull:
    image: ollama/ollama:latest
    container_name: voip-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      bash -c "
        sleep 5
        curl -X POST http://ollama:11434/api/pull -d '{"name": "llama3.1:8b"}'
      "
    restart: "no"

  # CockroachDB init (create database + schema)
  cockroach-init:
    image: cockroachdb/cockroach:latest-v24.1
    container_name: voip-cockroach-init
    depends_on:
      cockroachdb:
        condition: service_healthy
    entrypoint: >
      bash -c "
        sleep 5 &&
        cockroach sql --insecure --host=cockroachdb:26257 -e \"CREATE DATABASE IF NOT EXISTS voip;\" &&
        cockroach sql --insecure --host=cockroachdb:26257 -d voip -e \"
        CREATE TABLE IF NOT EXISTS call_sessions (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            state VARCHAR(32) NOT NULL,
            caller_id VARCHAR(64) NOT NULL,
            caller_number VARCHAR(32),
            called_number VARCHAR(32),
            direction VARCHAR(16) DEFAULT 'inbound',
            start_time TIMESTAMPTZ DEFAULT now(),
            end_time TIMESTAMPTZ,
            duration_seconds INT DEFAULT 0,
            llm_turn_count INT DEFAULT 0,
            intent VARCHAR(64),
            confidence FLOAT,
            agent_id VARCHAR(64),
            agent_name VARCHAR(128),
            transfer_reason VARCHAR(256),
            created_at TIMESTAMPTZ DEFAULT now(),
            updated_at TIMESTAMPTZ DEFAULT now()
        );
        CREATE INDEX IF NOT EXISTS idx_calls_state ON call_sessions(state);
        CREATE INDEX IF NOT EXISTS idx_calls_caller ON call_sessions(caller_id);
        CREATE INDEX IF NOT EXISTS idx_calls_time ON call_sessions(start_time DESC);
        CREATE INDEX IF NOT EXISTS idx_calls_agent ON call_sessions(agent_id) WHERE agent_id IS NOT NULL;
        CREATE TABLE IF NOT EXISTS transcripts (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            session_id UUID NOT NULL REFERENCES call_sessions(id) ON DELETE CASCADE,
            speaker VARCHAR(32) NOT NULL,
            text TEXT NOT NULL,
            audio_url VARCHAR(512),
            timestamp TIMESTAMPTZ DEFAULT now()
        );
        CREATE INDEX IF NOT EXISTS idx_transcripts_session ON transcripts(session_id, timestamp DESC);
        \"
      "
    restart: "no"

volumes:
  cockroach-data:
  redis-data:
  ollama-data:
  whisper-cache:
  piper-data:
  vosk-model:
  voip-logs:

networks:
  default:
    driver: bridge
